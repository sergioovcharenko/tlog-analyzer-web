<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>TLOG Analyzer — Вхід</title>
<style>
:root{color-scheme:dark;--bg:#080b0f;--card:#111821;--border:#263244;--muted:#94a3b8;--text:#f1f5f9;--accent:#22c55e;--danger:#fca5a5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);padding:28px;border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.logo{font-size:28px;font-weight:900;letter-spacing:.6px;margin-bottom:4px}.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input{width:100%;height:46px;border:1px solid #334155;border-radius:8px;background:#0b1118;color:#f8fafc;padding:0 12px;font-size:15px;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.10)}
button{width:100%;height:46px;margin-top:8px;border:0;border-radius:8px;background:var(--accent);color:#041109;font-weight:900;font-size:14px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
.msg{min-height:22px;margin-top:13px;font-size:12px;color:var(--danger);line-height:1.45}.note{margin-top:14px;color:#64748b;font-size:11px;line-height:1.45}
</style>
</head>
<body>
<form id="login" class="card" autocomplete="on">
  <div class="logo">🚁 TLOG ANALYZER</div>
  <div class="sub">Авторизований доступ • один активний сеанс</div>
  <div class="field"><label for="u">ЛОГІН</label><input id="u" name="username" autocomplete="username" required autofocus></div>
  <div class="field"><label for="p">ПАРОЛЬ</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
  <button id="b" type="submit">УВІЙТИ</button>
  <div id="m" class="msg"></div>
  <div class="note">Основний код аналізатора не завантажується до успішної авторизації.</div>
</form>
<script>
const API='https://tlog-analyzer-api.onrender.com';
const APP=API+'/app';
const form=document.getElementById('login');
const btn=document.getElementById('b');
const msg=document.getElementById('m');

async function existingSession(){
  try{
    const r=await fetch(API+'/auth/status',{credentials:'include',cache:'no-store'});
    if(r.ok) location.replace(APP);
  }catch(_){}
}
existingSession();

form.addEventListener('submit',async e=>{
  e.preventDefault();
  btn.disabled=true;
  msg.textContent='Перевірка...';
  try{
    const r=await fetch(API+'/auth/login',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})
    });
    let data={}; try{data=await r.json()}catch(_){}
    if(!r.ok){msg.textContent=data.detail||('Помилка входу: '+r.status);return}
    document.getElementById('p').value='';
    location.replace(APP);
  }catch(_){
    msg.textContent='Сервер авторизації недоступний. Спробуйте ще раз.';
  }finally{btn.disabled=false}
});
</script>
</body>
</html>
